name: Rebuild website

on:
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: write
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Build job
  build:
    if: "!contains(github.event.commits[0].message, 'Update pages [action]')"
    runs-on: ubuntu-latest
    container:
      image: ercoppa/introcp:latest
      options: --user root --workdir /__w/introcp/introcp
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup
        run: |
          ln -s /home/user/.venv /root/.venv
          ln -s /home/user/.venv /github/home/.venv || true
          ln -s /home/user/.cache /root/.cache
          ln -s /home/user/.cache /github/home/.cache || true
          mkdir -p docs
      - name: Update content
        run: make build-book
      - name: Save
        if: ${{ !env.ACT }}
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"
          git config --global --add safe.directory /__w/introcp/introcp
          git add src
          git add docs
          git commit -m "Update pages [action]" . || true
          git push || true

  # Publish job
  package:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs
        
  # Deployment job
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: package
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4